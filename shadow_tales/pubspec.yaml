name: shadow_tales
description: >-
  Interactive Islamic / Eastern folklore horror — a choose-your-own-adventure
  with a coin economy, rewarded ads and a VIP pass.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  # --- Plug these in when you go live (see lib/services/*.dart) -----------
  # google_mobile_ads: ^5.1.0     # rewarded video ads (AdMob)
  # in_app_purchase: ^3.2.0       # coin packs + VIP subscription
  #   (or purchases_flutter ^8.0.0 for RevenueCat)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/stories/
